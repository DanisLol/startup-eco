<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sprout</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: ui-rounded, system-ui, sans-serif;
        background: #f8f5ee;
        color: #1f2a24;
      }
      main {
        box-sizing: border-box;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        display: grid;
        place-items: center;
        border-radius: 1rem;
        background: #15803d;
        color: #fff;
        font-size: 1.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #5f6b64;
        line-height: 1.5;
      }
      code {
        font-size: 0.85em;
        background: #efeadf;
        padding: 0.1em 0.35em;
        border-radius: 0.35em;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark" aria-hidden="true">🌱</div>
        <h1>Sprout</h1>
        <p>
          Set <code>CAPACITOR_SERVER_URL</code> to your Next.js origin, then run
          <code>pnpm mobile:sync</code> and rebuild the app.
        </p>
      </div>
    </main>
  </body>
</html>
